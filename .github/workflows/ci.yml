name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  checks:
    name: typecheck, lint, boundaries, unit tests, build, drift, corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm verify
      - run: pnpm db:check-drift
      - run: pnpm fixtures:validate
      # The evaluation regenerates byte for byte, its README section is current, and precision
      # and the unsupported-value rate have not regressed against evaluation/baseline.json.
      - run: pnpm eval:ci

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: specledger
          POSTGRES_PASSWORD: specledger_ci_only
          POSTGRES_DB: specledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specledger -d specledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://specledger:specledger_ci_only@127.0.0.1:5432/specledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: end-to-end workflow (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: specledger
          POSTGRES_PASSWORD: specledger_ci_only
          POSTGRES_DB: specledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specledger -d specledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://specledger:specledger_ci_only@127.0.0.1:5432/specledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - run: pnpm --filter @specledger/web exec playwright install --with-deps chromium
      # The real API, worker and UI in a browser; the model is a deterministic stand-in, so CI
      # never calls a model (apps/web/e2e/server.mjs).
      - run: pnpm --filter @specledger/web e2e

  audit:
    name: dependency audit (high and above)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  commit-hygiene:
    name: commit hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # For pull requests, check the PR head itself, not GitHub's synthetic merge commit,
          # whose "Merge ... into ..." subject is not a conventional commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve the base of the range to check
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch: there is no previous commit, so check everything after the
            # root commit. The root commit itself is covered by the local pre-push hook only.
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            echo "::notice::No previous commit for this push; checking the range after the root commit."
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Check commits and tracked files
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: ./scripts/check-commit-hygiene.sh "$BASE"

  container:
    name: container image builds and serves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: specledger
          POSTGRES_PASSWORD: specledger_ci_only
          POSTGRES_DB: specledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specledger -d specledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag specledger-api:ci .
      # Replay only: CI never calls a model. The password and secret are throwaway values.
      - name: start the image and check it migrates, serves and enforces sign-in and the demo
        run: |
          password="$(openssl rand -hex 16)"
          PGPASSWORD=specledger_ci_only psql -h 127.0.0.1 -U specledger -d specledger \
            -c 'create database specledger_demo'
          docker run --detach --name api --network host \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://specledger:specledger_ci_only@127.0.0.1:5432/specledger \
            -e DEMO_DATABASE_URL=postgres://specledger:specledger_ci_only@127.0.0.1:5432/specledger_demo \
            -e DEMO_SESSION_SECRET="$(openssl rand -hex 32)" \
            -e LLM_PROVIDER=replay -e UPLOAD_ALLOWLIST=corpus \
            specledger-api:ci
          for _ in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ready && break
            sleep 1
          done
          code() { curl --silent --output /dev/null --write-out '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:3000/health)" = 200
          test "$(code http://127.0.0.1:3000/ready)" = 200
          test "$(code http://127.0.0.1:3000/documents)" = 401
          test "$(docker exec api id -u)" != 0
          # The first user is made with the CLI in the image; the password goes in on stdin.
          printf '%s\n' "$password" | docker exec -i api node apps/api/dist/scripts/user.js \
            create --email ci@example.com --name CI --roles engineer,reviewer
          test "$(code -c jar -H 'content-type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"password\":\"$password\"}" \
            http://127.0.0.1:3000/auth/login)" = 200
          grep -q '#HttpOnly_.*specledger_session' jar
          test "$(code -b jar http://127.0.0.1:3000/documents)" = 200
          test "$(code -b jar -X POST -H 'content-type: application/json' -d '{}' \
            http://127.0.0.1:3000/register/publish)" = 403
          test "$(code -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"wrong password"}' \
            http://127.0.0.1:3000/auth/login)" = 401
          # The demo: the showcase seeds itself from the corpus in the image and anyone may read
          # it; a workspace session is refused on the demo routes. A visitor sandbox waits until
          # the showcase is extracted, which replay cannot do for every document.
          for _ in $(seq 1 60); do
            seeded="$(curl --silent --fail http://127.0.0.1:3000/showcase/documents | jq '.documents | length')"
            [ "$seeded" = 7 ] && break
            sleep 1
          done
          test "$seeded" = 7
          test "$(code -b jar http://127.0.0.1:3000/demo/documents)" = 401
          test "$(code -X POST http://127.0.0.1:3000/showcase/register/publish)" = 404
          status="$(code -X POST http://127.0.0.1:3000/demo/session)"
          [ "$status" = 201 ] || [ "$status" = 503 ]
          test "$(curl --silent -b jar http://127.0.0.1:3000/documents | jq '.documents | length')" = 0
      - if: always()
        run: docker logs api 2>&1 | tail -50 || true
