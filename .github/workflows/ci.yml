name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  checks:
    name: typecheck, lint, boundaries, unit tests, build, migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm verify
      - run: pnpm db:check-drift

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: specledger
          POSTGRES_PASSWORD: specledger_ci_only
          POSTGRES_DB: specledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specledger -d specledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://specledger:specledger_ci_only@127.0.0.1:5432/specledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  audit:
    name: dependency audit (high and above)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  commit-hygiene:
    name: commit hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # For pull requests, check the PR head itself, not GitHub's synthetic merge commit,
          # whose "Merge ... into ..." subject is not a conventional commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve the base of the range to check
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch: there is no previous commit, so check everything after the
            # root commit. The root commit itself is covered by the local pre-push hook only.
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            echo "::notice::No previous commit for this push; checking the range after the root commit."
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Check commits and tracked files
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: ./scripts/check-commit-hygiene.sh "$BASE"
