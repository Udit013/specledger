name: specledger

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specledger_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-specledger}
    ports:
      # Loopback only: the database is never reachable from other machines on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
