# Render blueprint: the API and the worker as one free web service (apps/api/dist/serve.js).
# Values marked sync: false are entered in the Render dashboard and never committed.
# See docs/deployment.md.
services:
  - type: web
    name: specledger-api
    runtime: docker
    plan: free
    # Next to the Neon database (AWS US East 2, Ohio); change both together.
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Neon's direct (not -pooler) connection string, with sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Generated by Render: open the service's Environment tab to copy them for the UI.
      - key: API_ENGINEER_TOKEN
        generateValue: true
      - key: API_APPROVER_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # The Vercel production URL, e.g. https://specledger.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render's proxy sits in front of the service: rate limits see the client's address.
      - key: TRUST_PROXY
        value: '1'
      # A public demo accepts only the synthetic corpus PDFs.
      - key: UPLOAD_ALLOWLIST
        value: corpus
      - key: UPLOAD_RATE_LIMIT_PER_MINUTE
        value: '10'
      # The free instance has 512 MB.
      - key: INGEST_PARSE_MEMORY_MB
        value: '128'
