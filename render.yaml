# Render blueprint: the API and the worker as one free web service (apps/api/dist/serve.js).
# Values marked sync: false are entered in the Render dashboard and never committed.
# See docs/deployment.md.
services:
  - type: web
    name: specledger-api
    runtime: docker
    plan: free
    # Next to the Neon database (AWS US East 2, Ohio); change both together.
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Neon's direct (not -pooler) connection string, with sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Browsers reach the API through the UI's own origin (Vercel rewrites /api to this
      # service), so no CORS origin is needed. Two proxies sit in front of the service, Vercel's
      # and Render's: rate limits then see the client's address.
      - key: TRUST_PROXY
        value: '2'
      # A public demo accepts only the synthetic corpus PDFs.
      - key: UPLOAD_ALLOWLIST
        value: corpus
      - key: UPLOAD_RATE_LIMIT_PER_MINUTE
        value: '10'
      # The free instance has 512 MB.
      - key: INGEST_PARSE_MEMORY_MB
        value: '128'
      # The public demo (optional): a second Neon database, never DATABASE_URL. Leave it unset to
      # run without a demo; set it and the service serves /showcase and /demo, seeds the
      # showcase once, and gives each visitor a private sandbox schema in it.
      - key: DEMO_DATABASE_URL
        sync: false
      # Signs visitor sessions; generated by Render, never shown to anyone.
      - key: DEMO_SESSION_SECRET
        generateValue: true
